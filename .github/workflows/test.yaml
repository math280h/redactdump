name: "Test"

on:
  push:
  pull_request:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

    - name: Install dependencies
      run: uv sync

    - name: Run tests
      run: uv run pytest

    - name: Install optional faker dependencies
      run: uv pip install faker-vehicle Pillow xmltodict

    - name: Run optional provider tests
      run: uv run pytest -m "community or extras" --no-cov

    - name: Build coverage summary
      if: ${{ !cancelled() && github.event_name == 'pull_request' }}
      run: |
        if [ -f .coverage ]; then
          uv run coverage report --format=markdown > coverage.md
        else
          echo "No coverage data was produced." > coverage.md
        fi

    - name: Comment coverage on pull request
      if: ${{ !cancelled() && github.event_name == 'pull_request' }}
      continue-on-error: true
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
      with:
        script: |
          const fs = require('fs');
          const marker = '<!-- coverage-report -->';
          const table = fs.readFileSync('coverage.md', 'utf8');
          const body = `${marker}\n## Test coverage\n\n${table}`;
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner,
            repo,
            issue_number,
          });
          const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }
