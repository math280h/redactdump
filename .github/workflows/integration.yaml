name: "Integration"

on:
  push:
  pull_request:

jobs:
  integration:
    name: "integration / ${{ matrix.database }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - database: postgresql
            image: "postgres:16"
            port: 5432
            user: test
            password: secret
            options: '--health-cmd "pg_isready -U test" --health-interval 10s --health-timeout 5s --health-retries 10'
          - database: mysql
            image: "mysql:8"
            port: 3306
            user: test
            password: secret
            options: '--health-cmd "mysqladmin ping --silent" --health-interval 10s --health-timeout 5s --health-retries 10'
          - database: mssql
            image: "mcr.microsoft.com/mssql/server:2025-CU5-GDR1-ubuntu-24.04"
            port: 1433
            user: sa
            password: RedactSecret123
            options: '--health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P RedactSecret123 -C -Q ''SELECT 1'' -b" --health-interval 10s --health-timeout 5s --health-retries 10'

    services:
      db:
        image: "${{ matrix.image }}"
        ports:
          - "${{ matrix.port }}:${{ matrix.port }}"
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: test
          MYSQL_ROOT_PASSWORD: rootsecret
          MYSQL_USER: test
          MYSQL_PASSWORD: secret
          MYSQL_DATABASE: test
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: RedactSecret123
        options: "${{ matrix.options }}"

    steps:
    - name: Checkout repository
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Install ODBC Driver 18 for SQL Server
      if: matrix.database == 'mssql'
      run: |
        if ! odbcinst -q -d -n "ODBC Driver 18 for SQL Server" 2>/dev/null; then
          curl -fsSL -o /tmp/packages-microsoft-prod.deb "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
          sudo dpkg -i /tmp/packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
        fi

    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

    - name: Install dependencies
      run: uv sync

    - name: Run integration tests
      env:
        INTEGRATION_DB: "${{ matrix.database }}"
        INTEGRATION_HOST: 127.0.0.1
        INTEGRATION_PORT: "${{ matrix.port }}"
        INTEGRATION_USER: "${{ matrix.user }}"
        INTEGRATION_PASSWORD: "${{ matrix.password }}"
        INTEGRATION_DATABASE: test
      run: uv run pytest -m integration --no-cov

  # SQLite is file-based and needs no service container, so it runs as its
  # own lean job rather than a matrix entry.
  integration-sqlite:
    name: "integration / sqlite"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

    - name: Install dependencies
      run: uv sync

    - name: Run integration tests
      env:
        INTEGRATION_DB: sqlite
        INTEGRATION_DATABASE: "${{ runner.temp }}/integration.db"
      run: uv run pytest -m integration --no-cov
