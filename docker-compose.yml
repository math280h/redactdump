services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: "test"
      POSTGRES_PASSWORD: "secret"
      POSTGRES_DB: "test"
    ports:
      - "5432:5432"

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: "rootsecret"
      MYSQL_USER: "test"
      MYSQL_PASSWORD: "secret"
      MYSQL_DATABASE: "test"
    ports:
      - "3306:3306"

  mssql:
    image: mcr.microsoft.com/mssql/server:2025-CU5-GDR1-ubuntu-24.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "RedactSecret123"
    ports:
      - "1433:1433"
