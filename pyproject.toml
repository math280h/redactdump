[project]
name = "redactdump"
version = "0.4.0"
description = "Easily create database dumps with support for redacting data."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Mathias V. Nielsen", email = "math280h@users.noreply.github.com" }]
license = { file = "LICENSE" }
urls = { Homepage = "https://github.com/math280h/redactdump" }
dependencies = [
    "rich>=14.0",
    "PyYAML>=6.0.2",
    "schema>=0.7.7",
    "configargparse>=1.7",
    "SQLAlchemy>=2.0",
    "psycopg2-binary>=2.9.10",
    "pymysql>=1.1",
    "faker>=37.0",
]

[project.scripts]
redactdump = "redactdump.app:start_application"

[dependency-groups]
dev = [
    "pytest>=7.4",
    "ruff>=0.11",
    "ty>=0.0.44",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["redactdump"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["A", "B", "C4", "D", "E", "F", "I", "S", "W"]
ignore = ["D100", "D107", "D401", "E501", "S101", "S602", "S603", "S605", "S607", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"**/__init__.py" = ["D104", "F401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["redactdump", "tests"]
