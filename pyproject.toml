[project]
name = "redactdump"
version = "0.4.0"
description = "Easily create database dumps with support for redacting data."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mathias V. Nielsen", email = "math280h@users.noreply.github.com" }]
license = { file = "LICENSE" }
urls = { Homepage = "https://github.com/math280h/redactdump" }
dependencies = [
    "rich>=15.0",
    "PyYAML>=6.0.3",
    "pydantic>=2.13",
    "typer>=0.26",
    "SQLAlchemy[asyncio]>=2.0.50",
    "psycopg[binary]>=3.3",
    "aiomysql>=0.3.2",
    "aiofiles>=25.1",
    "faker>=40.0",
]

[project.scripts]
redactdump = "redactdump.app:start_application"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.1",
    "pytest-asyncio>=1.4",
    "pymysql>=1.2",
    "ruff>=0.15",
    "ty>=0.0.44",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=redactdump --cov-report=term-missing --cov-fail-under=90"
asyncio_mode = "auto"
markers = [
    "integration: tests that require a live database (selected with -m integration)",
    "community: tests that require an installed faker community provider (selected with -m community)",
]

[tool.coverage.run]
branch = true
source = ["redactdump"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["redactdump"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["A", "B", "C4", "D", "E", "F", "I", "S", "W"]
ignore = ["D100", "D107", "D401", "E501", "S101", "S602", "S603", "S605", "S607", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "D105"]
"**/__init__.py" = ["D104", "F401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["redactdump", "tests"]
